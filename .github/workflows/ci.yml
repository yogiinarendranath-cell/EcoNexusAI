name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "EcoNexus!Dev2026"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'EcoNexus!Dev2026' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      ECONEXUS_TEST_SQL_CONNECTION: "Server=localhost,1433;User Id=sa;Password=EcoNexus!Dev2026;TrustServerCertificate=True;Encrypt=False;"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore EcoNexus.slnx

      - name: Build
        run: dotnet build EcoNexus.slnx --no-restore --configuration Release

      - name: Test (unit with coverage threshold)
        run: >
          dotnet test tests/EcoNexus.UnitTests --no-build --configuration Release --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./TestResults/coverage.cobertura.xml
          /p:Include="[EcoNexus.Application]*"
          /p:Threshold=60
          /p:ThresholdType=line
          /p:ThresholdStat=Total

      - name: Test (architecture + integration)
        run: >
          dotnet test tests/EcoNexus.ArchitectureTests --no-build --configuration Release --verbosity normal
          && dotnet test tests/EcoNexus.IntegrationTests --no-build --configuration Release --verbosity normal

      - name: Upload coverage (unit tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: tests/EcoNexus.UnitTests/TestResults/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 7

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: ignore
          retention-days: 7